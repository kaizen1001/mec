<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>MEC - Công Việc</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { background: linear-gradient(135deg, #f3e5f5, #fce4ec); min-height: 100vh; }</style>
</head>
<body>
    
    <nav class="bg-white/80 backdrop-blur-md shadow-sm border-b border-purple-100 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="font-extrabold text-2xl bg-clip-text text-transparent bg-gradient-to-r from-[#7209b7] to-[#f72585]">MEC Hub</div>
        <div class="flex gap-8 font-semibold text-purple-900/70">
            <a href="dashboard.html" class="hover:text-[#b5179e] transition-colors pb-1">📊 Tổng quan</a>
            <a href="calendar.html" class="hover:text-[#b5179e] transition-colors pb-1">📅 Sự kiện</a>
            <a href="tasks.html" class="text-[#b5179e] border-b-2 border-[#b5179e] pb-1">✅ Công việc</a>
        </div>
        <div class="flex items-center gap-4">
            <button onclick="localStorage.clear(); window.location.href = 'index.html';" class="text-sm bg-pink-100 text-[#f72585] px-4 py-2 rounded-lg font-bold">Đăng xuất</button>
        </div>
    </nav>

    <div class="p-6 max-w-4xl mx-auto mt-4">
        <h2 class="text-3xl font-extrabold text-gray-800 mb-8">Nhiệm vụ của tôi</h2>
        
        <div class="space-y-4">
            <div class="bg-white p-6 rounded-2xl shadow-lg border-l-8 border-yellow-400 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                    <h3 class="text-xl font-bold text-gray-800">Thiết kế Standee sự kiện Halloween</h3>
                    <p class="text-gray-500 mt-1 font-medium">Hạn chót: <span class="font-bold text-red-500">30/10/2026 - 23:59</span></p>
                </div>
                <button class="bg-gradient-to-r from-[#7209b7] to-[#f72585] text-white px-6 py-3 rounded-xl font-bold hover:shadow-lg hover:scale-105 transition">
                    Đánh dấu Hoàn Thành
                </button>
            </div>
            
            <div class="bg-white/60 p-6 rounded-2xl shadow-sm border-l-8 border-green-400 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                    <h3 class="text-xl font-bold text-gray-800 line-through decoration-gray-400">Viết bài truyền thông FB</h3>
                    <p class="text-gray-500 mt-1 font-medium">Hạn chót: 25/10/2026</p>
                </div>
                <div class="flex flex-col items-end">
                    <span class="text-green-600 font-extrabold bg-green-100 px-4 py-2 rounded-full border border-green-200">Hoàn Thành Sớm (EARLY)</span>
                    <span class="text-xs text-gray-400 mt-1 font-bold">+5 Điểm</span>
                </div>
            </div>

             <div class="bg-white/60 p-6 rounded-2xl shadow-sm border-l-8 border-red-500 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                    <h3 class="text-xl font-bold text-gray-800">Lên danh sách check-in</h3>
                    <p class="text-gray-500 mt-1 font-medium">Hạn chót: 20/10/2026</p>
                </div>
                <div class="flex flex-col items-end">
                    <span class="text-red-600 font-extrabold bg-red-100 px-4 py-2 rounded-full border border-red-200">Hoàn Thành Trễ (LATE)</span>
                    <span class="text-xs text-gray-400 mt-1 font-bold">-3 Điểm</span>
                </div>
            </div>
        </div>
    </div>
    <script>if(!localStorage.getItem('user')) window.location.href = "index.html";</script>
</body>
</html>
