<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEC - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { background: linear-gradient(135deg, #f3e5f5, #fce4ec); min-height: 100vh; }</style>
</head>
<body>
    
    <nav class="bg-white/80 backdrop-blur-md shadow-sm border-b border-purple-100 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="font-extrabold text-2xl bg-clip-text text-transparent bg-gradient-to-r from-[#7209b7] to-[#f72585]">MEC Hub</div>
        <div class="flex gap-8 font-semibold text-purple-900/70">
            <a href="dashboard.html" class="text-[#b5179e] border-b-2 border-[#b5179e] pb-1">📊 Tổng quan</a>
            <a href="calendar.html" class="hover:text-[#b5179e] transition-colors pb-1">📅 Sự kiện</a>
            <a href="tasks.html" class="hover:text-[#b5179e] transition-colors pb-1">✅ Công việc</a>
        </div>
        <div class="flex items-center gap-4">
            <span id="userNameDisplay" class="font-bold text-[#7209b7]"></span>
            <button onclick="logout()" class="text-sm bg-pink-100 text-[#f72585] px-4 py-2 rounded-lg font-bold hover:bg-pink-200">Đăng xuất</button>
        </div>
    </nav>

    <div class="p-6 max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-8 mt-4">
        
        <div class="col-span-2 bg-white rounded-3xl shadow-xl overflow-hidden border border-purple-50">
            <div class="bg-gradient-to-r from-[#7209b7] to-[#f72585] p-5 text-white">
                <h2 class="text-xl font-bold">🏆 Bảng Xếp Hạng Hoạt Động</h2>
            </div>
            <div class="p-4 overflow-x-auto">
                <table class="w-full text-left">
                    <thead>
                        <tr class="border-b-2 border-purple-100 text-purple-800">
                            <th class="py-3 px-4">Hạng</th>
                            <th class="py-3 px-4">Thành viên</th>
                            <th class="py-3 px-4">Sự kiện</th>
                            <th class="py-3 px-4">Điểm Tích Lũy</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboardBody">
                        <tr><td colspan="4" class="text-center py-8 text-purple-500 font-medium">Đang tải dữ liệu...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="space-y-6">
            <div class="bg-white rounded-3xl shadow-xl p-8 border-t-4 border-[#3b5998] text-center">
                <h3 class="font-extrabold text-gray-800 mb-2">Fanpage MEC</h3>
                <p class="text-sm text-gray-500 mb-6">Theo dõi thông báo chính thức.</p>
                <a href="https://web.facebook.com/profile.php?id=100084796647707" target="_blank" class="block w-full bg-[#3b5998] text-white font-bold py-3 rounded-xl hover:shadow-lg transition">Truy cập Facebook</a>
            </div>
        </div>
    </div>

    <script>
        // Đã tích hợp API của bạn
        const API_URL = "https://script.google.com/macros/s/AKfycbzEpWhttc61bk7JkVa5atNUqpnSgA3fW5D8AdqIMgc_Zu0tzrF3FO-wnEMbKeH-EuHNeg/exec"; 
        const userStr = localStorage.getItem('user');
        if(!userStr) window.location.href = "index.html";
        else document.getElementById('userNameDisplay').innerText = `Hi, ${JSON.parse(userStr).name}`;

        function logout() { localStorage.clear(); window.location.href = "index.html"; }

        async function loadLeaderboard() {
            try {
                const response = await fetch(API_URL, { 
                    method: 'POST', 
                    body: JSON.stringify({ action: 'getLeaderboard' }),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                const result = await response.json();
                
                if(result.success) {
                    const tbody = document.getElementById('leaderboardBody');
                    tbody.innerHTML = '';
                    result.data.forEach((member, index) => {
                        let rankIcon = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : `#${index + 1}`;
                        tbody.innerHTML += `
                            <tr class="border-b border-purple-50 hover:bg-purple-50/50 transition">
                                <td class="py-4 px-4 font-black text-xl text-[#b5179e]">${rankIcon}</td>
                                <td class="py-4 px-4 font-bold text-gray-800">${member.name} <span class="text-xs ml-2 bg-purple-100 text-purple-700 px-2 py-1 rounded-full">${member.role}</span></td>
                                <td class="py-4 px-4 font-semibold text-gray-600">${member.events}</td>
                                <td class="py-4 px-4 font-extrabold text-[#f72585]">${member.score} pts</td>
                            </tr>
                        `;
                    });
                }
            } catch(e) {
                document.getElementById('leaderboardBody').innerHTML = '<tr><td colspan="4" class="text-center py-8 text-red-500 font-medium">Lỗi tải dữ liệu.</td></tr>';
            }
        }
        loadLeaderboard();
    </script>
</body>
</html>
