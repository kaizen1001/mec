<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEC - Tổng Quan Hoạt Động</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { background: linear-gradient(135deg, #f3e5f5, #fce4ec); min-height: 100vh; font-family: sans-serif; }</style>
</head>
<body>
    <nav class="bg-white/80 backdrop-blur-md shadow-sm border-b border-purple-100 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="font-extrabold text-2xl bg-clip-text text-transparent bg-gradient-to-r from-[#7209b7] to-[#f72585]">Media Events Club</div>
        <div class="flex gap-8 font-semibold text-purple-900/70">
            <a href="dashboard.html" class="text-[#b5179e] border-b-2 border-[#b5179e] pb-1">📊 Tổng quan</a>
            <a href="events.html" class="hover:text-[#b5179e] transition-colors pb-1">📅 Sự kiện</a>
            <a href="tasks.html" class="hover:text-[#b5179e] transition-colors pb-1">✅ Công việc</a>
            <a href="calendar.html" class="hover:text-[#b5179e] transition-colors pb-1">📆 Lịch Treo Tường</a>
        </div>
        <div class="flex items-center gap-4">
            <button onclick="localStorage.clear(); window.location.href='index.html'" class="text-sm bg-pink-100 text-[#f72585] px-4 py-2 rounded-lg font-bold hover:bg-pink-200 transition">Đăng xuất</button>
        </div>
    </nav>

    <div class="p-6 max-w-7xl mx-auto mt-4">
        <div class="grid grid-cols-2 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-white p-6 rounded-3xl shadow-xl border-t-4 border-[#7209b7] hover:-translate-y-1 transition duration-300">
                <p class="text-purple-500 font-bold text-xs tracking-wider uppercase">Tổng Thành Viên</p>
                <h3 class="text-4xl font-black text-[#7209b7] mt-2" id="statMembers">0</h3>
            </div>
            <div class="bg-white p-6 rounded-3xl shadow-xl border-t-4 border-[#f72585] hover:-translate-y-1 transition duration-300">
                <p class="text-pink-500 font-bold text-xs tracking-wider uppercase">Sự Kiện Đã Tổ Chức</p>
                <h3 class="text-4xl font-black text-[#f72585] mt-2" id="statEvents">0</h3>
            </div>
            <div class="bg-white p-6 rounded-3xl shadow-xl border-t-4 border-green-500 hover:-translate-y-1 transition duration-300">
                <p class="text-green-500 font-bold text-xs tracking-wider uppercase">Tỉ lệ hoàn thành Task</p>
                <h3 class="text-4xl font-black text-green-500 mt-2" id="statRate">0%</h3>
            </div>
            <div class="bg-white p-6 rounded-3xl shadow-xl border-t-4 border-blue-500 hover:-translate-y-1 transition duration-300">
                <p class="text-blue-500 font-bold text-xs tracking-wider uppercase mb-3">Đánh giá tiến độ</p>
                <div class="flex justify-between items-center text-sm font-bold bg-gray-50 p-2 rounded-lg">
                    <span class="text-green-600 flex flex-col items-center">Sớm <span class="text-xl" id="statEarly">0</span></span>
                    <span class="text-blue-600 flex flex-col items-center">Đúng <span class="text-xl" id="statOnTime">0</span></span>
                    <span class="text-red-600 flex flex-col items-center">Trễ <span class="text-xl" id="statLate">0</span></span>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-3xl shadow-xl overflow-hidden border border-purple-50">
            <div class="bg-gradient-to-r from-[#7209b7] to-[#f72585] p-5 text-white flex justify-between items-center">
                <h2 class="text-xl font-bold">🏆 Bảng Đánh Giá Năng Lực Thành Viên</h2>
                <button onclick="fetchDashboard()" class="text-sm bg-white/20 font-bold px-4 py-2 rounded-lg hover:bg-white/40 transition">🔄 Làm mới dữ liệu</button>
            </div>
            <div class="p-4 overflow-x-auto">
                <table class="w-full text-left">
                    <thead>
                        <tr class="border-b-2 border-purple-100 text-purple-800">
                            <th class="py-4 px-4 font-extrabold uppercase tracking-wider text-sm">Hạng</th>
                            <th class="py-4 px-4 font-extrabold uppercase tracking-wider text-sm">Thành viên</th>
                            <th class="py-4 px-4 font-extrabold uppercase tracking-wider text-sm">Tham gia sự kiện</th>
                            <th class="py-4 px-4 font-extrabold uppercase tracking-wider text-sm">Tổng Điểm KPI</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboardBody">
                        <tr><td colspan="4" class="text-center py-10 text-[#b5179e] font-bold">Đang đồng bộ dữ liệu...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const BASE_API_URL = "https://script.google.com/macros/s/AKfycbx2JueUDVRkZZ9E5pEL6S5TUPp71NrlDXVBC-AtoZHfCDjtbDSMs_2OB1q5FU92ucuCUQ/exec"; 
        if(!localStorage.getItem('user')) window.location.href = "index.html";

        async function callAPI(payload) {
            const NoCacheURL = BASE_API_URL + "?nocache=" + new Date().getTime(); 
            const response = await fetch(NoCacheURL, {
                method: 'POST', body: JSON.stringify(payload), headers: { 'Content-Type': 'text/plain;charset=utf-8' }
            });
            return await response.json();
        }

        async function fetchDashboard() {
            document.getElementById('leaderboardBody').innerHTML = '<tr><td colspan="4" class="text-center py-10 font-bold text-gray-500">Đang tải dữ liệu...</td></tr>';
            try {
                const result = await callAPI({ action: 'getDashboard' });
                if(result.success) {
                    document.getElementById('statMembers').innerText = result.stats.totalMembers || 0;
                    document.getElementById('statEvents').innerText = result.stats.totalEvents || 0;
                    document.getElementById('statRate').innerText = (result.stats.completionRate || 0) + "%";
                    document.getElementById('statEarly').innerText = result.stats.early || 0;
                    document.getElementById('statOnTime').innerText = result.stats.onTime || 0;
                    document.getElementById('statLate').innerText = result.stats.late || 0;

                    const tbody = document.getElementById('leaderboardBody');
                    tbody.innerHTML = '';
                    if(result.leaderboard.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="4" class="text-center py-8 text-gray-500">Chưa có dữ liệu thành viên.</td></tr>';
                        return;
                    }

                    result.leaderboard.forEach((member, index) => {
                        let rankIcon = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : `<span class="text-gray-400">#${index + 1}</span>`;
                        let rowClass = index < 3 ? "bg-purple-50/30" : ""; 
                        tbody.innerHTML += `
                            <tr class="border-b border-gray-100 hover:bg-purple-50 transition ${rowClass}">
                                <td class="py-4 px-4 font-black text-2xl text-[#b5179e] w-20">${rankIcon}</td>
                                <td class="py-4 px-4 font-bold text-gray-800 text-lg">${member.name}</td>
                                <td class="py-4 px-4 font-semibold text-gray-600"><span class="bg-gray-100 px-3 py-1 rounded-full border border-gray-200">${member.eventsAttended} sự kiện</span></td>
                                <td class="py-4 px-4 font-black text-2xl text-[#f72585]">${member.score} <span class="text-sm font-bold text-gray-400">pts</span></td>
                            </tr>
                        `;
                    });
                }
            } catch(e) { document.getElementById('leaderboardBody').innerHTML = '<tr><td colspan="4" class="text-center py-10 font-bold text-red-500">Lỗi kết nối CSDL!</td></tr>'; }
        }
        window.onload = fetchDashboard;
    </script>
</body>
</html>
