<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>MEC - Sự Kiện</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { background: linear-gradient(135deg, #f3e5f5, #fce4ec); min-height: 100vh; font-family: sans-serif; }</style>
</head>
<body>
    <nav class="bg-white/80 backdrop-blur-md shadow-sm border-b border-purple-100 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="font-extrabold text-2xl bg-clip-text text-transparent bg-gradient-to-r from-[#7209b7] to-[#f72585]">MEC Hub</div>
        <div class="flex gap-8 font-semibold text-purple-900/70">
            <a href="dashboard.html" class="hover:text-[#b5179e] transition-colors pb-1">📊 Tổng quan</a>
            <a href="events.html" class="text-[#b5179e] border-b-2 border-[#b5179e] pb-1">📅 Sự kiện</a>
            <a href="tasks.html" class="hover:text-[#b5179e] transition-colors pb-1">✅ Công việc</a>
        </div>
        <button onclick="localStorage.clear(); window.location.href='index.html'" class="text-sm bg-pink-100 text-[#f72585] px-4 py-2 rounded-lg font-bold">Đăng xuất</button>
    </nav>

    <div class="p-6 max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-8 mt-4">
        
        <!-- Cột 1: Form Tạo sự kiện -->
        <div class="bg-white p-6 rounded-3xl shadow-xl border-t-4 border-[#7209b7] h-fit">
            <h3 class="font-extrabold text-xl text-gray-800 mb-6">➕ Tạo Sự Kiện Mới</h3>
            <form id="createEventForm" class="space-y-4">
                <div>
                    <label class="text-xs font-bold text-gray-500">TÊN SỰ KIỆN</label>
                    <input type="text" id="evTitle" class="w-full px-4 py-3 border border-purple-100 bg-purple-50/50 rounded-xl focus:ring-2 focus:ring-[#b5179e] outline-none mt-1" required>
                </div>
                <div>
                    <label class="text-xs font-bold text-gray-500">NGÀY TỔ CHỨC</label>
                    <input type="date" id="evDate" class="w-full px-4 py-3 border border-purple-100 bg-purple-50/50 rounded-xl focus:ring-2 focus:ring-[#b5179e] outline-none mt-1" required>
                </div>
                <div>
                    <label class="text-xs font-bold text-gray-500">ĐỊA ĐIỂM</label>
                    <input type="text" id="evLocation" class="w-full px-4 py-3 border border-purple-100 bg-purple-50/50 rounded-xl focus:ring-2 focus:ring-[#b5179e] outline-none mt-1" required>
                </div>
                <button type="submit" id="btnSubmitEv" class="w-full bg-gradient-to-r from-[#7209b7] to-[#f72585] text-white font-bold py-3 rounded-xl hover:shadow-lg mt-4 transition">
                    Đăng Sự Kiện Lên Web
                </button>
            </form>
        </div>

        <!-- Cột 2: Danh sách sự kiện -->
        <div class="col-span-2 space-y-4" id="eventList">
            <div class="text-center py-10 font-bold text-[#b5179e]">Đang tải danh sách sự kiện từ hệ thống...</div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzEpWhttc61bk7JkVa5atNUqpnSgA3fW5D8AdqIMgc_Zu0tzrF3FO-wnEMbKeH-EuHNeg/exec"; 
        
        // Logic 1: Tạo sự kiện mới
        document.getElementById('createEventForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSubmitEv');
            btn.innerText = "Đang lưu..."; btn.disabled = true;

            const user = JSON.parse(localStorage.getItem('user'));
            const payload = {
                action: 'createEvent',
                title: document.getElementById('evTitle').value,
                date: document.getElementById('evDate').value,
                location: document.getElementById('evLocation').value,
                maxCapacity: 100,
                hostId: user ? user.id : 'UNKNOWN'
            };

            try {
                await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload), headers: { 'Content-Type': 'text/plain;charset=utf-8' }});
                alert("Đã tạo sự kiện thành công! Dữ liệu đã được lưu vào Google Sheets.");
                location.reload(); // Tải lại trang để thấy sự kiện mới
            } catch (err) { alert("Lỗi kết nối!"); btn.innerText = "Đăng Sự Kiện"; btn.disabled = false;}
        });

        // Logic 2: Hiển thị danh sách sự kiện
        async function loadEvents() {
            try {
                // Thêm timestamp để chống cache trình duyệt
                const res = await fetch(API_URL + "?t=" + new Date().getTime(), { 
                    method: 'POST', body: JSON.stringify({ action: 'getEvents' }), headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                const result = await res.json();
                const list = document.getElementById('eventList');
                list.innerHTML = '';
                
                if (result.data.length === 0) {
                    list.innerHTML = '<div class="text-center py-10 font-bold text-gray-500">Chưa có sự kiện nào.</div>';
                    return;
                }

                result.data.forEach(ev => {
                    let dateObj = new Date(ev.date);
                    let dateStr = dateObj.toLocaleDateString('vi-VN', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                    list.innerHTML += `
                        <div class="bg-white p-6 rounded-3xl shadow-sm border-l-8 border-[#f72585] flex flex-col md:flex-row justify-between items-start md:items-center gap-4 transition hover:shadow-md">
                            <div>
                                <h4 class="text-2xl font-black text-gray-800">${ev.title}</h4>
                                <p class="text-gray-500 font-medium mt-2 flex items-center gap-2">
                                    <span class="bg-purple-100 text-purple-700 px-2 py-1 rounded text-xs font-bold">📍 ${ev.location}</span>
                                    <span class="bg-pink-100 text-pink-700 px-2 py-1 rounded text-xs font-bold">📅 ${dateStr}</span>
                                </p>
                            </div>
                            <button class="bg-gray-100 text-gray-800 font-bold px-6 py-3 rounded-xl hover:bg-[#7209b7] hover:text-white transition">RSVP Tham gia</button>
                        </div>
                    `;
                });
            } catch(e) { document.getElementById('eventList').innerHTML = '<div class="text-center text-red-500">Lỗi tải dữ liệu.</div>'; }
        }
        loadEvents();
    </script>
</body>
</html>
