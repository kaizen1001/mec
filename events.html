<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>MEC - Quản Lý Sự Kiện</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { background: #f3f4f6; min-height: 100vh; font-family: sans-serif; }</style>
</head>
<body>
    <nav class="bg-white shadow-sm px-6 py-4 flex justify-between items-center mb-6">
        <div class="font-extrabold text-2xl text-[#b5179e]">MEC Hub</div>
        <div class="flex gap-8 font-semibold text-gray-500">
            <a href="dashboard.html" class="hover:text-[#b5179e]">📊 Tổng quan</a>
            <a href="events.html" class="text-[#b5179e] border-b-2 border-[#b5179e] pb-1">📅 Quản lý Sự kiện</a>
            <a href="tasks.html" class="hover:text-[#b5179e]">✅ Công việc</a>
        </div>
        <button onclick="localStorage.clear(); window.location.href='index.html'" class="text-sm bg-pink-100 text-[#f72585] px-4 py-2 rounded-lg font-bold">Đăng xuất</button>
    </nav>

    <div class="p-4 max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- FORM TẠO SỰ KIỆN MỚI -->
        <div class="bg-white p-6 rounded-xl shadow border-t-4 border-[#b5179e] h-fit">
            <h3 class="font-bold text-xl text-gray-800 mb-6 flex items-center gap-2">➕ Tạo Sự Kiện Mới</h3>
            <form id="createEventForm" class="space-y-4">
                <div>
                    <label class="text-xs font-bold text-gray-500">TÊN SỰ KIỆN</label>
                    <input type="text" id="evTitle" class="w-full px-4 py-2 border rounded focus:border-[#b5179e] outline-none mt-1" required>
                </div>
                <div>
                    <label class="text-xs font-bold text-gray-500">NGÀY TỔ CHỨC</label>
                    <input type="date" id="evDate" class="w-full px-4 py-2 border rounded mt-1" required>
                </div>
                <div class="flex gap-4">
                    <div class="flex-1">
                        <label class="text-xs font-bold text-gray-500">BẮT ĐẦU</label>
                        <input type="time" id="evStart" class="w-full px-4 py-2 border rounded mt-1" value="14:00" required>
                    </div>
                    <div class="flex-1">
                        <label class="text-xs font-bold text-gray-500">KẾT THÚC</label>
                        <input type="time" id="evEnd" class="w-full px-4 py-2 border rounded mt-1" value="17:00" required>
                    </div>
                </div>
                <div>
                    <label class="text-xs font-bold text-gray-500">ĐỊA ĐIỂM</label>
                    <input type="text" id="evLocation" class="w-full px-4 py-2 border rounded mt-1" required>
                </div>
                <button type="submit" id="btnSubmitEv" class="w-full bg-[#b5179e] text-white font-bold py-3 rounded hover:bg-purple-800 mt-4 transition">
                    Đăng Sự Kiện
                </button>
            </form>
        </div>

        <!-- DANH SÁCH SỰ KIỆN VÀ PHÂN VAI TRÒ -->
        <div class="col-span-2 space-y-6" id="eventList">
            <div class="text-center py-10 font-bold text-gray-500">Đang tải dữ liệu sự kiện...</div>
        </div>
    </div>

    <script>
        // DÁN API MỚI VÀO ĐÂY
        const API_URL = "YOUR_WEB_APP_URL_HERE"; 
        
        // 1. Logic tạo sự kiện
        document.getElementById('createEventForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSubmitEv');
            btn.innerText = "Đang lưu..."; btn.disabled = true;

            const user = JSON.parse(localStorage.getItem('user'));
            const payload = {
                action: 'createEvent',
                title: document.getElementById('evTitle').value,
                date: document.getElementById('evDate').value,
                startTime: document.getElementById('evStart').value,
                endTime: document.getElementById('evEnd').value,
                location: document.getElementById('evLocation').value,
                hostId: user ? user.id : 'UNKNOWN'
            };

            try {
                await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload), headers: { 'Content-Type': 'text/plain' }});
                alert("Tạo sự kiện thành công!");
                location.reload(); 
            } catch (err) { alert("Lỗi!"); btn.innerText = "Đăng Sự Kiện"; btn.disabled = false;}
        });

        // 2. Logic Load danh sách sự kiện
        async function loadEvents() {
            try {
                const res = await fetch(API_URL + "?t=" + new Date().getTime(), { 
                    method: 'POST', body: JSON.stringify({ action: 'getEvents' }), headers: { 'Content-Type': 'text/plain' }
                });
                const result = await res.json();
                const list = document.getElementById('eventList');
                list.innerHTML = '';
                
                if (result.data.length === 0) {
                    list.innerHTML = '<div class="text-center py-10 font-bold text-gray-500">Chưa có sự kiện nào.</div>';
                    return;
                }

                result.data.forEach(ev => {
                    let dateStr = new Date(ev.date).toLocaleDateString('vi-VN');
                    
                    // Render danh sách những người đã đăng ký (Bảng phân chia công việc)
                    let attendeesHtml = '';
                    if(ev.attendees && ev.attendees.length > 0) {
                        ev.attendees.forEach(att => {
                            let roleColor = att.role === 'Viết tin' ? 'text-green-600' : (att.role === 'Chụp ảnh' ? 'text-blue-600' : 'text-purple-600');
                            attendeesHtml += `
                                <tr class="border-b bg-gray-50">
                                    <td class="py-2 px-4 font-bold ${roleColor}">${att.role}</td>
                                    <td class="py-2 px-4 text-gray-700">${att.name}</td>
                                    <td class="py-2 px-4 text-sm text-gray-500">${att.date || 'N/A'}</td>
                                    <td class="py-2 px-4 text-sm font-semibold">${att.status}</td>
                                </tr>
                            `;
                        });
                    } else {
                        attendeesHtml = `<tr><td colspan="4" class="py-4 text-center text-sm text-gray-400">Chưa có ai đăng ký công việc.</td></tr>`;
                    }

                    list.innerHTML += `
                        <div class="bg-white rounded-xl shadow border border-gray-200 overflow-hidden mb-6">
                            <!-- Phần Header thông tin sự kiện -->
                            <div class="p-6 bg-slate-50 border-b flex justify-between items-start">
                                <div>
                                    <h4 class="text-xl font-bold text-slate-800">📅 ${ev.title}</h4>
                                    <p class="text-gray-600 text-sm mt-2">🗺️ Địa điểm: ${ev.location}</p>
                                    <span class="inline-block mt-2 bg-red-500 text-white text-xs font-bold px-2 py-1 rounded">Sự kiện</span>
                                </div>
                                <div class="text-right text-sm font-semibold text-gray-700 bg-gray-200 p-2 rounded">
                                    <p>Bắt đầu: ${ev.startTime}, ${dateStr}</p>
                                    <p>Kết thúc: ${ev.endTime}, ${dateStr}</p>
                                </div>
                            </div>
                            
                            <!-- Bảng phân công -->
                            <div class="overflow-x-auto">
                                <table class="w-full text-left text-sm">
                                    <thead class="bg-slate-100 text-gray-500">
                                        <tr>
                                            <th class="py-3 px-4 font-bold">VỊ TRÍ SỰ KIỆN CON</th>
                                            <th class="py-3 px-4 font-bold">NGƯỜI ĐĂNG KÝ</th>
                                            <th class="py-3 px-4 font-bold">NGÀY TẠO</th>
                                            <th class="py-3 px-4 font-bold">TÌNH TRẠNG</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${attendeesHtml}
                                    </tbody>
                                </table>
                            </div>

                            <!-- Đăng ký Vai trò (Form RSVP) -->
                            <div class="p-4 bg-gray-50 flex gap-4 items-center">
                                <select id="role-${ev.id}" class="border rounded px-4 py-2 outline-none">
                                    <option value="Viết tin">Viết tin</option>
                                    <option value="Chụp ảnh">Chụp ảnh</option>
                                    <option value="Hậu cần">Hậu cần</option>
                                    <option value="MC">MC</option>
                                </select>
                                <button onclick="rsvp('${ev.id}')" class="bg-blue-600 text-white font-bold px-6 py-2 rounded hover:bg-blue-700 transition">Đăng ký nhiệm vụ</button>
                            </div>
                        </div>
                    `;
                });
            } catch(e) { document.getElementById('eventList').innerHTML = '<div class="text-center text-red-500">Lỗi tải dữ liệu.</div>'; }
        }

        // 3. Logic Đăng ký vị trí (RSVP)
        async function rsvp(eventId) {
            const role = document.getElementById(`role-${eventId}`).value;
            const user = JSON.parse(localStorage.getItem('user'));
            
            const payload = {
                action: 'rsvpEvent',
                userId: user.id,
                eventId: eventId,
                roleInEvent: role
            };

            try {
                await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload), headers: { 'Content-Type': 'text/plain' }});
                alert(`Bạn đã đăng ký nhiệm vụ "${role}" thành công!`);
                loadEvents(); // Tải lại danh sách ngay lập tức
            } catch (err) { alert("Lỗi khi đăng ký!"); }
        }

        loadEvents();
    </script>
</body>
</html>
